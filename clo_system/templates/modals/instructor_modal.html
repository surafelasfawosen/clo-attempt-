<!-- MODAL: INSTRUCTOR ASSIGNMENT -->
<div id="modal-instructor-assignment" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs hidden">
  <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh] animate-in fade-in zoom-in-95 duration-200">
    
    <!-- Modal Header -->
    <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600/30 border border-blue-400/30 flex items-center justify-center text-blue-300 font-black text-sm">
          <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>
        <div>
          <h3 class="font-extrabold text-base tracking-wide text-white">Assign Course Teacher</h3>
          <p class="text-xs text-slate-300 font-medium" id="modal-inst-course-badge">Select an instructor to assign to this course</p>
        </div>
      </div>
      <button onclick="AssignmentsComponent.closeChangeInstructorModal()" class="text-slate-400 hover:text-white p-2 rounded-xl hover:bg-white/10 transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Modal Body: Department Faculty List -->
    <div class="p-6 overflow-y-auto space-y-4 flex-1 custom-scrollbar bg-slate-50/50">
      
      <div class="flex items-center justify-between px-1">
        <div>
          <h4 class="text-xs font-black uppercase tracking-wider text-slate-700">Department Faculty Members</h4>
          <p class="text-[11px] text-slate-500 font-medium">Click assign to link teacher to course</p>
        </div>
        <span id="instructor-modal-count-pill" class="text-xs font-bold bg-slate-200 text-slate-700 px-2.5 py-0.5 rounded-md">5 Faculty</span>
      </div>

      <div id="instructor-candidates-list" class="space-y-3">
        <!-- Dynamically populated via AssignmentsComponent.renderInstructorCandidates() -->
      </div>

    </div>

    <!-- Modal Footer -->
    <div class="bg-slate-100 px-6 py-3 border-t border-slate-200 flex justify-between items-center">
      <span class="text-xs text-slate-500 font-medium">Assigned teacher will be reflected on the syllabus and course roster.</span>
      <button onclick="AssignmentsComponent.closeChangeInstructorModal()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs px-5 py-2 rounded-xl transition cursor-pointer">
        Close
      </button>
    </div>

  </div>
</div>
