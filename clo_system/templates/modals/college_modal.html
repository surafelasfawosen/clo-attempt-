<!-- MODAL: ADD / EDIT COLLEGE -->
<div id="collegeModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
  <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200">
    <div class="flex justify-between items-center border-b pb-3">
      <h3 class="font-extrabold text-slate-900 text-base" id="college_modal_title">Add New College</h3>
      <button onclick="CollegesComponent.closeModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
    </div>
    <input type="hidden" id="college_modal_id">
    <div class="space-y-3 text-xs">
      <div>
        <label class="block font-bold text-slate-700 mb-1">College Name <span class="text-red-500">*</span></label>
        <input type="text" id="college_modal_name" placeholder="e.g. College of Computing" class="w-full border rounded-lg px-3 py-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Dean / Head Faculty</label>
        <input type="text" id="college_modal_dean" placeholder="e.g. Dr. Abebe K." class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">University</label>
        <input type="text" id="college_modal_univ" value="Debre Berhan University" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-50 text-slate-600">
      </div>
    </div>
    <div class="flex justify-end gap-2 pt-2 border-t">
      <button onclick="CollegesComponent.closeModal()" class="px-4 py-2 rounded-xl border font-bold text-xs text-slate-600 hover:bg-slate-100">Cancel</button>
      <button onclick="CollegesComponent.submitModal()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-sm">Save College</button>
    </div>
  </div>
</div>
