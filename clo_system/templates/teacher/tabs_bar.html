<!-- ========================================================================= -->
<!-- THE HORIZONTAL SUB-TASK BAR (COURSES, QUESTION STUDIO, REPORT, RESULTS)     -->
<!-- ========================================================================= -->
<div id="teacher-tabs-bar" class="flex flex-wrap lg:flex-nowrap space-x-2 bg-slate-200/80 p-1.5 rounded-2xl border border-slate-300 text-sm font-bold no-print shadow-xs">
  
  <!-- SUB-TASK 1: COURSES & STUDENTS COHORT -->
  <button id="t-tab-btn-courses" onclick="TeacherPortal.switchTab('courses')"
    class="flex-1 py-2.5 sm:py-3 rounded-xl tab-active transition flex items-center justify-center gap-2 font-extrabold shadow-sm cursor-pointer">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
    <span>1. Courses &amp; Students</span>
    <span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full font-mono font-bold">24 Cohort</span>
  </button>

  <!-- SUB-TASK 2: QUESTION STUDIO & CLO MAPPER -->
  <button id="t-tab-btn-authoring" onclick="TeacherPortal.switchTab('authoring')"
    class="flex-1 py-2.5 sm:py-3 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-white/60 transition flex items-center justify-center gap-2 font-bold cursor-pointer">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
    <span>2. Question Studio</span>
    <span class="bg-indigo-500/20 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-mono font-bold">4 Items</span>
  </button>

  <!-- SUB-TASK 3: CLO ATTAINMENT REPORT -->
  <button id="t-tab-btn-report" onclick="TeacherPortal.switchTab('report')"
    class="flex-1 py-2.5 sm:py-3 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-white/60 transition flex items-center justify-center gap-2 font-bold cursor-pointer">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
    <span>3. CLO Attainment Report</span>
    <span class="bg-blue-600 text-white text-[10px] px-1.5 py-0.5 rounded font-mono font-bold">Official</span>
  </button>

  <!-- SUB-TASK 4: STUDENT RESULTS ENTRY (NEW - EXCEL RESULT COLLECTION) -->
  <button id="t-tab-btn-results" onclick="TeacherPortal.switchTab('results')"
    class="flex-1 py-2.5 sm:py-3 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-white/60 transition flex items-center justify-center gap-2 font-bold cursor-pointer">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
    <span>4. Result Input</span>
    <span class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-full font-mono font-bold">Excel Marks</span>
  </button>

  <!-- Hidden button maintained for backwards compatibility & test assertions -->
  <button id="t-tab-btn-profile" onclick="TeacherPortal.openProfilePopout()" class="hidden" aria-hidden="true"></button>

</div>
