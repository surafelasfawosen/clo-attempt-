<!-- Studio Header: Metadata, Mode Toggle & Contextual Actions -->
<div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-4 no-print">
  <div>
    <div class="flex items-center gap-2">
      <button onclick="App.goToStage(State._studioReturnStage || ((State.activeCourse && (State.activeCourse.department_id === 'dept_freshman_common' || State.activeCourse.stream)) ? 'freshman-hub' : 'courses'))" class="text-xs font-bold text-slate-500 hover:text-blue-600 flex items-center gap-1 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-lg transition">
        <span id="studio-back-label">&larr; Back to Courses List</span>
      </button>
      <span id="studio-course-year-pill" class="bg-blue-50 text-blue-700 text-xs font-bold px-2.5 py-0.5 rounded-md border border-blue-200 font-mono">Year 4 &bull; Semester II</span>
    </div>
    <h3 class="text-lg md:text-xl font-extrabold text-slate-900 mt-2" id="studio-course-title">
      Stat4092: Operations Research and Optimization
    </h3>
    <p class="text-xs font-semibold text-slate-500" id="studio-course-dept-label">Department of Data Science</p>
  </div>

  <!-- Clean Header Action Strip -->
  <div class="flex items-center flex-wrap gap-3">
    <!-- Mode Toggle: Edit Course vs View Syllabus -->
    <div class="inline-flex p-1 bg-slate-100 rounded-xl border border-slate-300 shadow-inner">
      <button id="studio-mode-edit" onclick="CourseStudioComponent.setMode('edit')" class="px-4 py-2 rounded-lg text-sm font-extrabold transition flex items-center gap-2 bg-blue-600 text-white shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        <span>Edit Course</span>
      </button>
      <button id="studio-mode-view" onclick="CourseStudioComponent.setMode('view')" class="px-4 py-2 rounded-lg text-sm font-extrabold transition flex items-center gap-2 text-slate-600 hover:text-slate-900">
        <svg class="w-4 h-4 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
        <span>View Syllabus</span>
      </button>
    </div>

    <!-- In Edit Mode: Save to DB -->
    <div id="studio-edit-actions" class="flex items-center gap-2">
      <button id="btn-save-course" onclick="CourseStudioComponent.save()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold px-4 py-2 rounded-xl shadow-sm transition flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span>Save to DB</span>
      </button>
    </div>

    <!-- In View Mode: Download Word (.docx) & Print ONLY -->
    <div id="studio-view-actions" class="hidden flex items-center gap-2">
      <button onclick="DossierComponent.downloadDocx()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold px-4 py-2 rounded-xl transition flex items-center gap-2 shadow-sm shadow-blue-500/20">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <span>Download Word (.docx)</span>
      </button>
      <button onclick="DossierComponent.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold px-4 py-2 rounded-xl transition flex items-center gap-2 shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
        <span>Print</span>
      </button>
    </div>
  </div>
</div>
