<!-- STAGE: FRESHMAN ACADEMIC & COMMON COURSES STUDIO -->
<section id="stage-freshman-hub" class="max-w-6xl mx-auto space-y-6 hidden">

  <!-- TOP HEADER -->
  <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div class="space-y-1">
      <div class="flex items-center gap-2">
        <span class="bg-blue-600/10 text-blue-700 text-xs font-black uppercase tracking-wider px-3 py-1 rounded-xl border border-blue-200 flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
          </svg>
          College of Freshman Studies
        </span>
        <span class="bg-slate-100 text-slate-600 text-xs font-bold px-2.5 py-0.5 rounded-lg border border-slate-200">
          Dean: Dr. Girma Abebe
        </span>
      </div>
      <h2 class="text-xl md:text-2xl font-black text-slate-900 tracking-tight">
        Freshman Common Courses Studio
      </h2>
      <p class="text-xs font-medium text-slate-500">
        Direct foundation courses, course specifications, CLOs, and chapter syllabus design without department routing.
      </p>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2 flex-wrap">
      <button onclick="App.goToStage('colleges')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 border border-slate-300">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span>Back to Colleges</span>
      </button>
      <button onclick="FreshmanHubComponent.refresh()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 border border-blue-200 shadow-xs">
        <svg class="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <span>Refresh Data</span>
      </button>
    </div>
  </div>

  <!-- FRESHMAN COMMON COURSES VIEW -->
  <div id="fresh-view-courses" class="space-y-5">
    <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-center gap-3 flex-wrap">
        <!-- 1. Stream Filter (Natural vs. Social Science) -->
        <div class="flex items-center gap-1.5">
          <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Stream:</label>
          <select id="fresh-courses-stream-filter" onchange="FreshmanHubComponent.filterCourses()"
            class="bg-blue-50 border border-blue-300 text-blue-900 text-xs font-extrabold rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="ALL" selected>All Academic Streams</option>
            <option value="Natural Science">Natural Science Stream</option>
            <option value="Social Science">Social Science Stream</option>
          </select>
        </div>

        <!-- Semester I badge — Freshman has only 1 semester -->
        <span class="bg-indigo-50 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-lg border border-indigo-200">
          Semester I Only
        </span>

        <span id="fresh-courses-count-badge" class="bg-indigo-50 text-indigo-700 font-mono text-xs font-bold px-2.5 py-1 rounded-lg border border-indigo-200">
          15 Courses Available
        </span>
      </div>

      <button onclick="FreshmanHubComponent.openAddCourseModal()"
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-1.5 shadow-sm shadow-blue-500/20">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        <span>+ Add Common Course</span>
      </button>
    </div>

    <!-- Courses Grid -->
    <div id="fresh-courses-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- Dynamically populated via FreshmanHubComponent.renderCourses() -->
    </div>
  </div>

  <!-- MODAL: ADD COMMON COURSE -->
  <div id="modal-fresh-add-course" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs hidden">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden">
      <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
        <h4 class="font-extrabold text-base">New Common Course → Opens in Course Studio</h4>
        <button onclick="FreshmanHubComponent.closeAddCourseModal()" class="text-slate-400 hover:text-white p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Course Code (e.g. Math1011 or Math1013)</label>
          <input type="text" id="fresh-new-course-code" placeholder="e.g. Math1011" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Course Title</label>
          <input type="text" id="fresh-new-course-title" placeholder="e.g. Mathematics for Natural Sciences" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Academic Stream</label>
            <select id="fresh-new-course-stream" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
              <option value="Natural Science" selected>Natural Science Stream</option>
              <option value="Social Science">Social Science Stream</option>
              <option value="Common">Common to Both Streams</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Credit Hours</label>
            <input type="number" id="fresh-new-course-cr" value="3" min="1" max="6" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
          </div>
        </div>
      </div>
      <div class="bg-slate-100 px-6 py-3 border-t border-slate-200 flex justify-end gap-2">
        <button onclick="FreshmanHubComponent.closeAddCourseModal()" class="px-4 py-2 text-xs font-bold text-slate-600 hover:text-slate-800">Cancel</button>
        <button onclick="FreshmanHubComponent.submitNewCourse()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-5 py-2 rounded-xl transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          Create &amp; Open in Studio
        </button>
      </div>
    </div>
  </div>

</section>
