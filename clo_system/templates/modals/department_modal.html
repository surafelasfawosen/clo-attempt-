<!-- MODAL: ADD / EDIT DEPARTMENT -->
<div id="departmentModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
  <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200">
    <div class="flex justify-between items-center border-b pb-3">
      <h3 class="font-extrabold text-slate-900 text-base" id="dept_modal_title">Add New Department</h3>
      <button onclick="DepartmentsComponent.closeModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
    </div>
    <input type="hidden" id="dept_modal_id">
    <div class="space-y-3 text-xs">
      <div>
        <label class="block font-bold text-slate-700 mb-1">Department Name <span class="text-red-500">*</span></label>
        <input type="text" id="dept_modal_name" placeholder="e.g. Department of Software Engineering" class="w-full border rounded-lg px-3 py-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Department Code <span class="text-slate-400 font-normal">(optional, auto-generated if left blank)</span></label>
        <input type="text" id="dept_modal_code" placeholder="e.g. SE, CS, or DaSc" class="w-full border rounded-lg px-3 py-2 text-sm font-mono uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Head of Department</label>
        <input type="text" id="dept_modal_head" placeholder="e.g. Dr. Mesfin T." class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
    </div>
    <div class="flex justify-end gap-2 pt-2 border-t">
      <button onclick="DepartmentsComponent.closeModal()" class="px-4 py-2 rounded-xl border font-bold text-xs text-slate-600 hover:bg-slate-100">Cancel</button>
      <button onclick="DepartmentsComponent.submitModal()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-sm">Save Department</button>
    </div>
  </div>
</div>
