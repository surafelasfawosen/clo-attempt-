<!-- MODAL: ADD NEW COURSE (WITH REAL TEMPLATES) -->
<div id="courseModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
  <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-slate-200">
    <div class="flex justify-between items-center border-b pb-3">
      <div>
        <h3 class="font-extrabold text-slate-900 text-base">Add New Course</h3>
        <p class="text-xs font-semibold text-slate-500">Pre-fill using official syllabus templates from debrief documents:</p>
      </div>
      <button onclick="CoursesComponent.closeAddModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
    </div>

    <!-- Quick Template Pre-fill Buttons -->
    <div class="flex items-center gap-2 bg-slate-100 p-2 rounded-xl text-xs">
      <span class="font-bold text-slate-500">Quick Fill:</span>
      <button type="button" onclick="CoursesComponent.fillTemplate('ML')" class="bg-white border border-slate-300 hover:border-blue-500 hover:text-blue-600 text-slate-700 font-semibold px-2.5 py-1 rounded-lg text-xs transition">
        Machine Learning
      </button>
      <button type="button" onclick="CoursesComponent.fillTemplate('SQC')" class="bg-white border border-slate-300 hover:border-indigo-500 hover:text-indigo-600 text-slate-700 font-semibold px-2.5 py-1 rounded-lg text-xs transition">
        Operations Research
      </button>
    </div>

    <div class="space-y-3 text-xs">
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Course Code <span class="text-red-500">*</span></label>
          <input type="text" id="course_modal_code" placeholder="e.g. DaSc4011" class="w-full border rounded-lg px-3 py-1.5 font-mono font-bold text-blue-700 text-sm">
        </div>
        <div class="col-span-2">
          <label class="block font-bold text-slate-700 mb-1">Course Title <span class="text-red-500">*</span></label>
          <input type="text" id="course_modal_title" placeholder="e.g. Big Data Analytics" class="w-full border rounded-lg px-3 py-1.5 font-bold text-sm">
        </div>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Academic Year</label>
          <select id="course_modal_year" class="w-full border rounded-lg px-2.5 py-1.5 font-medium text-xs">
            <option value="Year 1">Year 1</option>
            <option value="Year 2">Year 2</option>
            <option value="Year 3">Year 3</option>
            <option value="Year 4">Year 4</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Semester</label>
          <select id="course_modal_sem" class="w-full border rounded-lg px-2.5 py-1.5 font-medium text-xs">
            <option value="Semester I">Semester I</option>
            <option value="Semester II">Semester II</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Credit Hours</label>
          <input type="number" id="course_modal_credits" value="3" class="w-full border rounded-lg px-2.5 py-1.5 font-bold text-xs">
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1">Prerequisites</label>
        <input type="text" id="course_modal_prereqs" placeholder="e.g. Calculus, Linear Algebra, Python" class="w-full border rounded-lg px-3 py-1.5 text-xs">
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1">Course Description</label>
        <textarea id="course_modal_desc" rows="3" placeholder="Syllabus overview and goals..." class="w-full border rounded-lg p-2.5 leading-relaxed text-xs"></textarea>
      </div>
    </div>

    <div class="flex justify-end gap-2 pt-2 border-t">
      <button onclick="CoursesComponent.closeAddModal()" class="px-4 py-2 rounded-xl border font-bold text-xs text-slate-600 hover:bg-slate-100">Cancel</button>
      <button onclick="CoursesComponent.submitAddModal()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-sm">Create Course</button>
    </div>
  </div>
</div>
